name: live-chain-test
on:
  workflow_dispatch:
  push:
    branches: ["live-test/**"]
permissions:
  contents: write
concurrency:
  group: live-chain-test
  cancel-in-progress: false      # scheduled runs queue behind a running one instead of killing it
jobs:
  live:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartcopy
          POSTGRES_PASSWORD: smartcopy_test
          POSTGRES_DB: smartcopy_live
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartcopy -d smartcopy_live"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://smartcopy:smartcopy_test@localhost:5432/smartcopy_live
      RPC_ETHEREUM_1: ${{ secrets.RPC_ETHEREUM_1 }}
      RPC_ETHEREUM_2: ${{ secrets.RPC_ETHEREUM_2 || secrets.PRC_ETHEREUM_2 }}   # accepts the secret under either spelling
      RPC_BASE_1: ${{ secrets.RPC_BASE_1 }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Unit tests that need no network
        run: python -m pytest -q tests/test_chain_abi.py tests/test_chain_rpc.py tests/test_market.py
      - name: Probe providers
        run: python scripts/provider_probe.py
      - name: Real ingestion + independent cross-check
        id: live
        continue-on-error: true
        env:
          LIVE_CHAINS: ethereum        # Base is paused (only free public endpoints; its 429s made every scheduled run look red)
        run: python scripts/live_verify.py
      - name: Wallet attribution on real Ethereum data
        id: market
        continue-on-error: true
        timeout-minutes: 70
        env:
          MARKET_DISCOVERY_BLOCKS: ${{ vars.MARKET_DISCOVERY_BLOCKS || '300' }}
          MARKET_WATCH_BLOCKS: ${{ vars.MARKET_WATCH_BLOCKS || '3600' }}
        run: python scripts/market_run.py
      - name: Wallet attribution on real Base data (smoke run)
        id: market_base
        if: vars.RUN_BASE_SMOKE == 'true'     # opt-in: the free private endpoint runs out of credits when this runs on every push
        continue-on-error: true
        timeout-minutes: 40
        env:
          MARKET_CHAIN: base
          MARKET_DISCOVERY_BLOCKS: ${{ vars.MARKET_BASE_DISCOVERY_BLOCKS || '600' }}
          MARKET_WATCH_BLOCKS: ${{ vars.MARKET_BASE_WATCH_BLOCKS || '1800' }}
        run: python scripts/market_run.py
      - name: Store this run's trades (branch live-test-data) and re-run the walk-forward analysis
        id: history
        if: always()
        continue-on-error: true
        run: |
          set -e
          git config --global user.name "github-actions"; git config --global user.email "actions@users.noreply.github.com"   # global: the clone below is outside the workspace repo
          rm -rf /tmp/hist && mkdir /tmp/hist
          if git ls-remote --exit-code --heads origin live-test-data >/dev/null 2>&1; then
            git clone --quiet --branch live-test-data --depth 50 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/hist
          else
            git init --quiet /tmp/hist && git -C /tmp/hist checkout --quiet --orphan live-test-data
            git -C /tmp/hist remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          # only a run whose integrity checks all passed may enter the history; a failed run is reported, not stored
          if python - <<'PY'
          import json, sys
          r = json.load(open("reports/market_run.json"))
          i = r.get("integrity") or {}
          sys.exit(0 if i and not i.get("steps_failed") and not any(v for k, v in i.items() if k != "steps_failed" and k != "receipts_inconsistent") and i.get("receipts_inconsistent") == 0 else 1)
          PY
          then OK=1; else OK=0; echo "run NOT stored: integrity checks did not all pass" | tee reports/history_status.txt; fi
          if [ "$OK" = 1 ] && [ -f reports/trades_ethereum.jsonl.gz ]; then
            mkdir -p /tmp/hist/ethereum
            cp reports/trades_ethereum.jsonl.gz "/tmp/hist/ethereum/trades_$(date -u +%Y%m%dT%H%M%SZ)_${GITHUB_SHA::7}.jsonl.gz"
            git -C /tmp/hist add ethereum
            git -C /tmp/hist commit --quiet -m "trades of run ${GITHUB_RUN_ID}" || true
            for i in 1 2 3; do git -C /tmp/hist push --quiet origin live-test-data && break || { git -C /tmp/hist pull --quiet --rebase origin live-test-data; sleep 3; }; done
          fi
          python scripts/aggregate.py --runs /tmp/hist --out reports || echo "no history yet" | tee -a reports/history_status.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish reports to branch live-test-reports
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan live-test-reports
          git rm -rf --cached . >/dev/null 2>&1 || true
          for f in probe.md probe.json selection.json live_verify.md live_verify.json market_run.md market_run.json market_run_base.md market_run_base.json aggregate.md aggregate.json history_status.txt; do
            [ -f reports/$f ] && git add -f reports/$f || true     # one missing file (e.g. skipped Base step) must not drop the others
          done
          git commit -m "live test reports for ${GITHUB_SHA}" || echo "nothing to commit"
          git push -f origin live-test-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-reports
          path: reports/
      - name: Fail the job if a live check failed
        if: steps.live.outcome == 'failure' || steps.market.outcome == 'failure' || steps.market_base.outcome == 'failure'
        run: exit 1
